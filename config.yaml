# OpenClaw Voice Configuration
# SIP ↔ xAI Grok Voice Agent Bridge (OpenClaw Plugin)

xai:
  api_key: ${XAI_API_KEY}
  voice: "Rex"  # Options: Rex, Ara, Sal, Eve, Leo
  instructions: |
    You are a helpful voice assistant.
    Keep responses brief and conversational - you're talking on a phone.

sip:
  server: "free1.voipgateway.org"
  port: 5060
  extension: "your_extension"
  password: ${SIP_PASSWORD}
  display_name: "OpenClaw"
  rtp_port: 40000

# Audio settings
# NOTE: No conversion needed! xAI supports 8kHz u-law natively.
audio:
  format: "pcmu"  # G.711 u-law
  sample_rate: 8000
  frame_ms: 20

# Daemon settings
daemon:
  api_port: 8079
  max_concurrent_calls: 3
  # How many finished calls to keep in memory for the /calls listing.
  # Without a cap the daemon retains every call it ever served.
  max_call_history: 50

# OpenClaw Gateway integration
openclaw:
  gateway_port: 18789
  gateway_token: ${OPENCLAW_GATEWAY_TOKEN}
  session_key: "openclaw-voice"

# Authentication
auth:
  # The shared single-tenant config. The customer instance for customer1 uses
  # its own config (see /etc/openclaw-voice/customers/customer1/config.yaml),
  # which requires a PIN. This shared config is kept fail-closed so that a
  # misconfigured or accidental start of the legacy plain unit cannot hand
  # an anonymous caller the privileged toolset.
  require_pin: true
  pin: ${OPENCLAW_AUTH_PIN}
  whitelist: []  # caller numbers that skip PIN (e.g. ["+1555XXXX567"])

# Logging
logging:
  level: "INFO"
  record_calls: false
